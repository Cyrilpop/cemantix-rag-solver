name: CI

# Périmètre : ce qui peut être vérifié sans conteneur ni base de données.
# Les tests forcent le repli SQLite, ils n'ont donc besoin que de Python.
#
# Ce workflow est volontairement non bloquant à l'import (continue-on-error) :
# le plan d'optimisation prévoit de le rendre bloquant une fois les phases 1 et 2
# fusionnées (docs/roadmap/2026-10-securite-seo-performance/01-plan.md, Phase 0).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests unitaires (stdlib unittest, SQLite en mémoire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff
        run: ruff check src tests --select E9,F63,F7,F82

  docs:
    name: Cohérence de la documentation
    runs-on: ubuntu-latest
    # Pas de continue-on-error : ce contrôle passe sur l'état courant, il ne doit
    # donc jamais régresser. Un document versionné qui renvoie à un fichier absent
    # est le défaut QUAL-17, déjà rencontré une fois.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liens, tableaux et compteurs de la roadmap
        run: python tools/check_docs.py
      - name: Validation du balisage SEO et Open Graph
        run: |
          python tools/check_seo.py
          python tools/check_og_image.py

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        # PYSEC-2026-311/3813/3814/3815 : aucun correctif publié pour chromadb à ce
        # jour (colonne « Fix Versions » vide dans l'OSV). 1.5.9 est la dernière
        # version avec wheel précompilé pour Python 3.12 — repasser sous 0.4.x
        # imposerait de compiler chroma-hnswlib (g++) à chaque build. Réévaluer
        # dès qu'une version corrigée sort, puis retirer les --ignore-vuln.
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  lighthouse:
    name: Contrôle Lighthouse CI (SEO & Accessibilité)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Audit Lighthouse CLI statique
        run: |
          npm install -g @lhci/cli
          lhci healthcheck || true
