# =============================================================================
# Cémantix Solver — nginx de test local (hors git)
# -----------------------------------------------------------------------------
# Miroir fidèle de la config Caddy de production documentée dans README.md:344,
# enrichi des en-têtes de sécurité du plan (.idea/PLAN_OPTIMISATION.MD, SEC-08).
#
# POINT IMPORTANT : la Content-Security-Policy est livrée en **Report-Only**.
# Tant que volumes/web/js/game.js:195,209,553,582 et multi.js injectent des
# style="…" inline et que battle.js:687 / multi.js:938 utilisent des onclick=
# inline, une CSP stricte CASSERAIT l'affichage. Ce Report-Only sert justement
# à mesurer ces violations avant de les corriger (SEC-02) puis d'activer la CSP
# appliquée dans le Caddyfile de production.
#
# DEUX PIÈGES NGINX TRAITÉS ICI :
#  1. `add_header` dans un `location` annule TOUS les `add_header` hérités du
#     `server`. Les en-têtes de sécurité seraient donc perdus sur les pages.
#     -> On ne déclare add_header qu'au niveau `server`, et la valeur de
#        Cache-Control est calculée par `map` selon l'URI.
#  2. Un `try_files … /index.html =404` transforme chaque URL inconnue en 200
#     (soft 404) : mauvais pour le crawl. -> Seules les vraies URLs répondent.
# =============================================================================

# --- Format dédié aux rapports CSP (payload JSON sur une ligne) --------------
# Avertissement : nginx résout les formats de log À L'ORDRE DE LECTURE.
# Un `log_format` placé après sa première utilisation fait échouer le démarrage
# ("unknown log format") — d'où sa position ici, avant tout `access_log`.
log_format csp '$remote_addr [$time_local] CSP "$request_body"';

# --- Cache-Control par type d'URL (http context, donc valable dans server) ---
map $uri $cemantix_cache_control {
    default                     "no-cache, must-revalidate";
    "~*\.(woff2?)$"             "public, max-age=31536000, immutable";
    "~*\.(ico|png|jpe?g|webp|svg)$" "public, max-age=86400, must-revalidate";
    "~^/api/"                   "no-store, max-age=0";
}

# --- X-Robots-Tag : vide (donc en-tête omis) sauf sur l'API (SEO-04) ---------
map $uri $cemantix_robots {
    default     "";
    "~^/api/"   "noindex, nofollow, noarchive";
}

server {
    # 8080 et non 80 : l'image nginx-unprivileged tourne en uid 101 et ne peut
    # pas binder un port < 1024. C'est exactement le comportement visé en durcissement.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    server_tokens off;

    # Résolution DNS Docker différée : nginx démarre même si l'API n'est pas encore prête
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cemantix_api http://cemantix_web:8000;

    # ---------------------------------------------------------------------
    # En-têtes de sécurité (SEC-08) — déclarés UNE SEULE FOIS ici, hérités partout
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag              $cemantix_robots always;
    add_header Cache-Control             $cemantix_cache_control always;
    # HSTS désactivé volontairement en local (pas de TLS) — actif en prod :
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP en Report-Only : à basculer en `Content-Security-Policy` une fois SEC-02 corrigé.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    # ---------------------------------------------------------------------
    # Flux SSE « Défier le bot » — À MAINTENIR AUSSI EN PRODUCTION (Caddy)
    # ---------------------------------------------------------------------
    # Un défi peut rester silencieux le temps que le worker s'en saisisse. Avec
    # les seules directives du `location /api/` (proxy_read_timeout 30s + mise en
    # tampon par défaut), nginx ferme le flux et le navigateur affiche
    # `net::ERR_CONNECTION_CLOSED`. Le serveur émet bien un battement toutes les
    # 10 s, mais encore faut-il que le proxy ne bufferise pas et ne s'impatiente pas.
    # NB : pas de quantifieur `{32}` dans le regex — nginx reserve `{`/`}` comme
    # delimitateurs de bloc (`unknown directive "32}/stream$"` a l'essai). Le
    # serveur, lui, valide deja l'identifiant en 32 hexadecimaux.
    location ~ ^/api/challenge/[0-9a-f]+/stream$ {
        proxy_pass $cemantix_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  900s;
        proxy_send_timeout  900s;
    }

    # ---------------------------------------------------------------------
    # API REST -> conteneur cemantix_web
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass $cemantix_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # hop unique : pas d'usurpation possible
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        client_max_body_size  8k;                          # SEC-06, côté nginx
    }

    # Réceptacle des rapports CSP : écrit dans /tmp (tmpfs accessible à uid 101)
    # plutôt que /var/log/nginx, réservé par les symlinks stdout/stderr de l'image.
    # Lecture : docker exec cemantix_nginx cat /tmp/csp.log
    location = /__csp-report {
        access_log /tmp/csp.log csp;
        return 204;
    }

    # ---------------------------------------------------------------------
    # URLs propres : /play -> /play/index.html, et vraie 404 sinon
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Ne jamais servir un fichier caché autre que /.well-known
    location ~ /\.well-known {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }

    # Logs : on laisse l'image faire (access.log -> /dev/stdout,
    # error.log -> /dev/stderr via le nginx.conf de l'image unprivileged).
}

